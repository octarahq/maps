name: Build and Upload Android Release APK

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'android-') || startsWith(github.ref_name, 'all-')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Release APK (unsigned)
        run: ./gradlew assembleRelease

      - name: Prepare APK name with tag version
        id: prepare_apk
        run: |
          VERSION="${GITHUB_REF_NAME#*-}"
          NEW_NAME="maps-${VERSION}.apk"

          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "Erreur : Aucun APK trouvé dans app/build/outputs/apk/release/"
            exit 1
          fi

          mv "$APK_PATH" "$NEW_NAME"
          echo "apk_file=$NEW_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" "${{ steps.prepare_apk.outputs.apk_file }}" --clobber